<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(40% 40% at 12% 2%,rgba(90,162,255,.12),transparent 60%),radial-gradient(40% 40% at 90% 2%,rgba(169,139,255,.10),transparent 60%),linear-gradient(180deg,#070c16,#0a1322 55%,#070c16);min-height:100vh;color:#eaf0f8;padding:24px 20px 60px}
.wrap{max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cr{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#12233c,#0a1626);border:1px solid rgba(216,185,120,.35);color:#d8b978;font-family:Georgia,serif;font-weight:700}
.brand{color:#9fb0c6;font-size:13px}.brand b{color:#eaf0f8}
.controls{display:flex;gap:9px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tabs{display:inline-flex;gap:3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:3px}
.tabs button{font:inherit;font-size:13px;font-weight:650;padding:7px 15px;border:none;border-radius:8px;background:transparent;color:#9fb0c6;cursor:pointer}
.tabs button.on{background:#5aa2ff;color:#08111f}
select{font:inherit;font-size:13px;background:rgba(255,255,255,.06);color:#eaf0f8;border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 11px}
.upbtn{font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.03em;background:#f47216;color:#08111f;border:none;border-radius:9px;padding:9px 15px;cursor:pointer}
#ustat{font-size:11.5px;color:#9fb0c6;margin-left:4px}
h1{font-size:19px;font-weight:750}.sub{color:#9fb0c6;font-size:13px;margin:2px 0 16px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:16px}
.hero{padding:24px 26px}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.big{font-size:42px;font-weight:800;letter-spacing:-1px}.big small{font-size:19px;font-weight:600;color:#9fb0c6}
.pill{background:rgba(240,115,111,.12);border:1px solid rgba(240,115,111,.35);color:#f0736f;font-weight:700;font-size:14px;padding:9px 16px;border-radius:14px;white-space:nowrap}
.pill.ok{background:rgba(63,206,133,.12);border-color:rgba(63,206,133,.4);color:#3fce85}
.pill.warn{background:rgba(227,179,65,.12);border-color:rgba(227,179,65,.4);color:#e3b341}
.bar{position:relative;height:28px;border-radius:9px;background:rgba(255,255,255,.06);margin:18px 0 8px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0}.mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.6)}
.scale{display:flex;justify-content:space-between;color:#8696ad;font-size:12px}
.chan{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-top:16px}
.ch{padding:13px 15px}.dot{width:10px;height:10px;border-radius:4px;display:inline-block;margin-right:6px}
.ch .n{color:#9fb0c6;font-size:12.5px}.ch .v{font-size:15px;font-weight:750;margin-top:3px}.ch .v small{display:block;font-size:11px;color:#9fb0c6;font-weight:600;margin-top:1px}
.note{color:#8696ad;font-size:12.5px;margin-top:15px;line-height:1.5}.note b{color:#cdd8e8}
.sec{margin-top:20px;padding:20px 22px}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}.sec h2{font-size:16px;font-weight:750}.sec .dono{color:#9fb0c6;font-size:12.5px}
.mtot{background:linear-gradient(135deg,rgba(63,206,133,.14),rgba(63,206,133,.05));border:1px solid rgba(63,206,133,.34)}
.mtot .mtl{color:#9fdcbb;font-size:12.5px;font-weight:650;letter-spacing:.02em}
.mtot .mtv{color:#3fce85;font-size:30px;font-weight:850;margin:3px 0 1px;letter-spacing:-.5px}
.mtot .mtw{color:#7fa690;font-size:11px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.ktile{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 15px}
.ktile.wide{grid-column:1/-1}
.kn{color:#9fb0c6;font-size:12px;min-height:30px}
.kv{font-size:22px;font-weight:800;margin-top:2px}.kv2{color:#a78bfa;font-weight:700;font-size:18px}
.kw{color:#64748b;font-size:10.5px;margin:2px 0 6px}
.delta{font-size:12.5px;font-weight:700;margin-left:6px;white-space:nowrap}.delta.up{color:#3fce85}.delta.down{color:#f0736f}.delta.flat{color:#8696ad}
.kchart{margin-top:4px}
.leg{display:flex;gap:16px;margin-top:8px;font-size:12px;color:#9fb0c6}.leg i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
.tip{position:fixed;pointer-events:none;background:#0c1626;border:1px solid rgba(160,200,235,.3);border-radius:9px;padding:7px 10px;font-size:12.5px;z-index:50;opacity:0;transition:opacity .07s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip .tw{color:#8fa3bd;font-size:11px;margin-bottom:3px}.tip .tr{display:flex;align-items:center;gap:7px;margin-top:2px}.tip .tr i{width:12px;height:3px;border-radius:2px;display:inline-block}.tip .tr b{font-size:14px}
footer{color:#64748b;font-size:11.5px;text-align:center;margin-top:26px}
@media(max-width:900px){.chan{grid-template-columns:repeat(2,1fr)}.kgrid{grid-template-columns:repeat(2,1fr)}}

function num(v){ if(v===null||v===undefined)return null; if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v).trim(); if(['','-','–','—','x','X','%','Não iniciado','R$'].includes(s))return null;
  s=s.replace(/R\$/g,'').replace(/dias?/gi,'').replace(/x/gi,'').trim(); const pct=s.endsWith('%'); s=s.replace(/%/g,'').trim();
  if(s===''||s==='-')return null; if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(','))s=s.replace(',','.');
  const f=parseFloat(s); if(!isFinite(f))return null; return pct?f/100:f; }

let STATE={brand:'fish',month:null},DATA=null,GID=0;
function parseAll(wb){const res={};for(const bk of['fish','aristo']){const cfg=CFG[bk];
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[cfg.sheet],{header:1,raw:true,blankrows:true});const wc=weekCols(aoa);
  const channels=cfg.channels.map(ch=>({...ch,series:aggSeries(aoa,ch.rows,wc,'sum')}));
  const areas=cfg.areas.map(ar=>({t:ar.t,d:ar.d,kpis:ar.kpis.map(k=>({n:k.n,f:k.f,series:aggSeries(aoa,k.rows,wc,k.a)}))}));
  let lastIdx=0;const allS=channels.map(c=>c.series).concat(...areas.map(a=>a.kpis.map(k=>k.series)));
  wc.forEach((w,i)=>{if(allS.some(s=>s[i]!=null))lastIdx=i;});
  res[bk]={wc,channels,areas,metaM:cfg.metaM,quad:cfg.quad,lastIdx};}return res;}
function fmt(v,f){if(v==null)return '—';
  if(f==='money')return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});if(f==='int')return Math.round(v).toLocaleString('pt-BR');
  if(f==='x')return v.toFixed(2).replace('.',',')+'x';if(f==='dec')return v.toFixed(2).replace('.',',');
  if(f==='pct')return (v*100).toFixed(1).replace('.',',')+'%';if(f==='dias')return Math.round(v)+' dias';return ''+v;}
function short(v,f){ if(v==null)v=0;
  if(f==='money')return Math.abs(v)>=1000?Math.round(v/1000)+'k':(''+Math.round(v));
  if(f==='int')return ''+Math.round(v);
  if(f==='x')return v.toFixed(1).replace('.',',')+'x';
  if(f==='dec')return v.toFixed(1).replace('.',',');
  if(f==='pct')return Math.round(v*100)+'%';
  if(f==='dias')return ''+Math.round(v);
  return ''+v; }
function deltaHTML(arr){ // variação % da última semana vs a anterior
  if(!arr||arr.length<2)return '';
  const last=arr[arr.length-1]==null?0:arr[arr.length-1], prev=arr[arr.length-2]==null?0:arr[arr.length-2];
  if(prev===0&&last===0)return '';
  if(prev===0)return '<span class="delta up" title="vs semana anterior">▲ novo</span>';
  const p=(last-prev)/Math.abs(prev)*100;
  if(Math.abs(p)<0.05)return '<span class="delta flat" title="vs semana anterior">0,0%</span>';
  const up=p>0;return `<span class="delta ${up?'up':'down'}" title="vs semana anterior">${up?'▲':'▼'} ${Math.abs(p).toFixed(1).replace('.',',')}%</span>`;
}
function kMoney(v){return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function mi(v){return 'R$ '+(v/1e6).toFixed(2).replace('.',',')+'M';}
function monthsIn(wc){const s=[];wc.forEach(w=>{if(!s.includes(w.m))s.push(w.m);});return s;}
function defaultMonth(bd){const mk=bd.channels.find(c=>c.key==='mkt');const ms=monthsIn(bd.wc);
  for(let i=ms.length-1;i>=0;i--){const m=ms[i];let c=0;bd.wc.forEach((w,idx)=>{if(w.m===m&&mk.series[idx]!=null&&mk.series[idx]>0&&idx<=bd.lastIdx)c++;});if(c>=2)return m;}return ms[ms.length-1];}
function windowIdx(bd,mo){const wc=bd.wc;const cur=[],prev=[];
  wc.forEach((w,i)=>{if(i>bd.lastIdx)return;if(w.m===mo)cur.push(i);else if(w.m===mo-1)prev.push(i);});
  let idx=prev.slice(-4).concat(cur);
  if(!idx.length){idx=[];for(let i=Math.max(0,bd.lastIdx-7);i<=bd.lastIdx;i++)idx.push(i);}return idx;}
const tip=()=>document.getElementById('tip');
function chart(host,seriesList,wcs){
  const W=560,H=128,pL=6,pR=6,pT=22,pB=22,plotW=W-pL-pR,plotH=H-pT-pB,nW=wcs.length;
  const xs=i=>pL+(nW<=1?plotW/2:i/(nW-1)*plotW);
  let all=[];seriesList.forEach(s=>s.vals.forEach(v=>all.push(v==null?0:v)));
  let mx=Math.max(...all,0),mn=Math.min(...all,0);if(mx===mn)mx=mn+1;const pad=(mx-mn)*0.14||1,top=mx+pad,bot=(mn>=0?0:mn-pad);
  const ys=v=>pT+plotH-(v-bot)/(top-bot)*plotH;const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('preserveAspectRatio','none');svg.style.width='100%';svg.style.height='132px';svg.style.overflow='visible';
  const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);
  for(let g=0;g<=2;g++){const y=pT+plotH*g/2;const ln=document.createElementNS(NS,'line');ln.setAttribute('x1',pL);ln.setAttribute('x2',W-pR);ln.setAttribute('y1',y);ln.setAttribute('y2',y);ln.setAttribute('stroke','rgba(160,200,235,.10)');ln.setAttribute('stroke-dasharray','3 5');svg.appendChild(ln);}
  seriesList.forEach((s,si)=>{const gid='g'+(GID++);const lg=document.createElementNS(NS,'linearGradient');lg.setAttribute('id',gid);lg.setAttribute('x1','0');lg.setAttribute('y1','0');lg.setAttribute('x2','0');lg.setAttribute('y2','1');
    const st1=document.createElementNS(NS,'stop');st1.setAttribute('offset','0');st1.setAttribute('stop-color',s.color);st1.setAttribute('stop-opacity','0.38');
    const st2=document.createElementNS(NS,'stop');st2.setAttribute('offset','1');st2.setAttribute('stop-color',s.color);st2.setAttribute('stop-opacity','0');lg.appendChild(st1);lg.appendChild(st2);defs.appendChild(lg);
    const pts=s.vals.map((v,i)=>({x:xs(i),y:ys(v==null?0:v),v:(v==null?0:v)}));
    const area=document.createElementNS(NS,'path');area.setAttribute('d','M'+pts.map(p=>p.x+','+p.y).join(' L')+` L${pts[pts.length-1].x},${pT+plotH} L${pts[0].x},${pT+plotH} Z`);
    area.setAttribute('fill','url(#'+gid+')');svg.appendChild(area);
    const poly=document.createElementNS(NS,'polyline');poly.setAttribute('points',pts.map(p=>p.x+','+p.y).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke',s.color);poly.setAttribute('stroke-width','2');poly.setAttribute('vector-effect','non-scaling-stroke');poly.setAttribute('stroke-linejoin','round');svg.appendChild(poly);
    pts.forEach(p=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','2.4');c.setAttribute('fill',s.color);svg.appendChild(c);
      const tx=document.createElementNS(NS,'text');tx.setAttribute('x',p.x);tx.setAttribute('y',si===1?(p.y+14):(p.y-7));tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','8.5');tx.setAttribute('font-weight','700');tx.setAttribute('fill',s.color);tx.textContent=short(p.v,s.f);svg.appendChild(tx);});});
  wcs.forEach((w,i)=>{if(nW>8&&i%2!==0&&i!==nW-1)return;const tx=document.createElementNS(NS,'text');tx.setAttribute('x',xs(i));tx.setAttribute('y',H-5);tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size','8.5');tx.setAttribute('fill','#64748b');tx.textContent=w.s;svg.appendChild(tx);});
  const cross=document.createElementNS(NS,'line');cross.setAttribute('stroke','rgba(255,255,255,.4)');cross.setAttribute('stroke-width','1');cross.setAttribute('y1',pT);cross.setAttribute('y2',pT+plotH);cross.style.opacity=0;svg.appendChild(cross);
  const dots=seriesList.map(s=>{const c=document.createElementNS(NS,'circle');c.setAttribute('r','4');c.setAttribute('fill',s.color);c.setAttribute('stroke','#0a1322');c.setAttribute('stroke-width','1.5');c.style.opacity=0;svg.appendChild(c);return c;});
  function mv(ev){const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)/r.width*W;let i=Math.round((px-pL)/plotW*(nW-1));i=Math.max(0,Math.min(nW-1,i));
    const x=xs(i);cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.opacity=1;const t=tip();t.innerHTML='';
    const tw=document.createElement('div');tw.className='tw';tw.textContent=wcs[i].s+' · '+wcs[i].date;t.appendChild(tw);
    seriesList.forEach((s,si)=>{const v=s.vals[i]==null?0:s.vals[i];dots[si].setAttribute('cx',x);dots[si].setAttribute('cy',ys(v));dots[si].style.opacity=1;
      const tr=document.createElement('div');tr.className='tr';const ic=document.createElement('i');ic.style.background=s.color;const b=document.createElement('b');b.textContent=fmt(v,s.f);tr.appendChild(ic);tr.appendChild(b);
      if(seriesList.length>1){const sp=document.createElement('span');sp.style.color='#8fa3bd';sp.textContent=s.name;tr.appendChild(sp);}t.appendChild(tr);});
    t.style.opacity=1;t.style.left=(ev.clientX+14)+'px';t.style.top=(ev.clientY-10)+'px';}
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerleave',()=>{tip().style.opacity=0;cross.style.opacity=0;dots.forEach(d=>d.style.opacity=0);});
  host.innerHTML='';host.appendChild(svg);}
function render(){const bk=STATE.brand,bd=DATA[bk],wc=bd.wc;
  if(STATE.month==null||!monthsIn(wc).includes(STATE.month))STATE.month=defaultMonth(bd);const mo=STATE.month;
  const win=windowIdx(bd,mo),wcs=win.map(i=>wc[i]);
  const msel=document.getElementById('msel');msel.innerHTML='';monthsIn(wc).forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=MESN[m];if(m===mo)o.selected=true;msel.appendChild(o);});
  document.getElementById('bfish').classList.toggle('on',bk==='fish');document.getElementById('baristo').classList.toggle('on',bk==='aristo');
  const chVals=bd.channels.map(c=>({...c,val:monthSum(c.series,wc,mo)}));const cons=chVals.reduce((a,c)=>a+c.val,0);
  const meta=bd.metaM[mo]||null,hasMeta=meta!=null,pct=hasMeta?cons/meta*100:null;
  const semanas=wc.filter(w=>w.m===mo).map(w=>w.s);
  let hero=`<div class="hrow"><div class="big">R$ ${cons.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})} ${hasMeta?`<small>/ R$ ${meta.toLocaleString('pt-BR')}</small>`:''}</div>`;
  hero+=hasMeta?`<div class="pill ${pct>=100?'ok':''}">${pct.toFixed(1).replace('.',',')}% da meta · faltam ${mi(Math.max(0,meta-cons))}</div>`:`<div class="pill warn">definir meta</div>`;
  hero+='</div>';
  if(hasMeta){let acc=0;hero+='<div class="bar">';chVals.forEach(c=>{const w=Math.max(0,c.val/meta*100);hero+=`<div class="seg" style="left:${acc}%;width:${w}%;background:${c.color}"></div>`;acc+=w;});hero+=`<div class="mk" style="left:100%"></div></div><div class="scale"><span>0</span><span>meta ${mi(meta)}</span></div>`;}
  hero+='<div class="chan">';chVals.forEach(c=>{const p=hasMeta?Math.round(c.val/meta*100):null;hero+=`<div class="card ch"><div class="n"><span class="dot" style="background:${c.color}"></span>${c.label}</div><div class="v">${kMoney(c.val)} ${p!=null?`<small>${p}% da meta</small>`:''}</div></div>`;});hero+='</div>';
  hero+=`<div class="note">Consolidado = soma de <b>todos os canais</b> nas semanas do mês vigente (${semanas.join(', ')||'—'}) · meta de ${MESN[mo]} ${hasMeta?mi(meta):''} · quadrimestre ${mi(bd.quad)}.</div>`;
  document.getElementById('hero').innerHTML=hero;
  document.getElementById('htitle').textContent=(bk==='fish'?'Fishermans':'O Aristocrata')+' · KPIs do mês';
  document.getElementById('hsub').textContent='Mês vigente: '+MESN[mo]+' ('+(semanas[0]||'')+(semanas.length>1?'–'+semanas[semanas.length-1]:'')+') · evolução: últimas semanas do mês anterior + mês atual';
  const host=document.getElementById('sections');host.innerHTML='';
  bd.areas.forEach(ar=>{const sec=document.createElement('div');sec.className='card sec';
    sec.innerHTML=`<div class="sechead"><h2>${ar.t}</h2>${ar.d?`<span class="dono">${ar.d}</span>`:''}</div>`;
    const grid=document.createElement('div');grid.className='kgrid';
    const rev=ar.kpis[0];
    if(rev&&rev.f==='money'){const revM=monthSum(rev.series,wc,mo);
      const mt=document.createElement('div');mt.className='ktile wide mtot';
      mt.innerHTML=`<div class="mtl">Faturamento do mês · ${MESN[mo]}</div><div class="mtv">${fmt(revM,'money')}</div><div class="mtw">soma das semanas de ${MESN[mo]}: ${semanas.join(', ')||'—'}</div>`;
      grid.appendChild(mt);}
    const prod=ar.kpis.find(k=>k.n.startsWith('Criativos produzidos')),noar=ar.kpis.find(k=>k.n.startsWith('Criativos novos'));
    let skip=[];
    if(prod&&noar){skip=[prod.n,noar.n];const lpi=win[win.length-1];const tile=document.createElement('div');tile.className='ktile wide';
      const dp=deltaHTML(win.map(i=>prod.series[i])),dn=deltaHTML(win.map(i=>noar.series[i]));
      tile.innerHTML=`<div class="kn">Criativos: produzidos × no ar</div><div class="kv">${fmt(prod.series[lpi]==null?0:prod.series[lpi],'int')} ${dp} <span class="kv2">× ${fmt(noar.series[lpi]==null?0:noar.series[lpi],'int')}</span> ${dn}</div><div class="kw">última: ${wc[lpi]?wc[lpi].s+' · '+wc[lpi].date:'—'}</div>`;
      const ch=document.createElement('div');ch.className='kchart';tile.appendChild(ch);
      const leg=document.createElement('div');leg.className='leg';leg.innerHTML=`<span><i style="background:#5aa2ff"></i>Produzidos</span><span><i style="background:#a78bfa"></i>Novos no ar</span>`;tile.appendChild(leg);
      grid.appendChild(tile);
      chart(ch,[{name:'Produzidos',color:'#5aa2ff',f:'int',vals:win.map(i=>prod.series[i])},{name:'Novos no ar',color:'#a78bfa',f:'int',vals:win.map(i=>noar.series[i])}],wcs);}
    ar.kpis.forEach(k=>{if(skip.includes(k.n))return;const lpi=win[win.length-1];const lv=k.series[lpi];
      const dH=deltaHTML(win.map(i=>k.series[i]));
      const tile=document.createElement('div');tile.className='ktile';
      tile.innerHTML=`<div class="kn">${k.n}</div><div class="kv">${fmt(lv==null?0:lv,k.f)} ${dH}</div><div class="kw">última: ${wc[lpi]?wc[lpi].s+' · '+wc[lpi].date:'—'}</div>`;
      const ch=document.createElement('div');ch.className='kchart';tile.appendChild(ch);grid.appendChild(tile);
      chart(ch,[{name:k.n,color:'#5aa2ff',f:k.f,vals:win.map(i=>k.series[i])}],wcs);});
    sec.appendChild(grid);host.appendChild(sec);});}
function boot(wb,keepMonth){const m=STATE.month;DATA=parseAll(wb);STATE.month=keepMonth?m:null;render();}
function b64enc(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));return btoa(s);}
function pad2(n){return(''+n).padStart(2,'0');}
document.getElementById('bfish').onclick=()=>{STATE.brand='fish';STATE.month=null;render();};
document.getElementById('baristo').onclick=()=>{STATE.brand='aristo';STATE.month=null;render();};
document.getElementById('msel').onchange=e=>{STATE.month=+e.target.value;render();};
document.getElementById('upl').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'});boot(wb,true);
    const now=new Date();const ts=pad2(now.getDate())+'/'+pad2(now.getMonth()+1)+' '+pad2(now.getHours())+':'+pad2(now.getMinutes());
    try{localStorage.setItem('kpiwb',b64enc(rd.result));localStorage.setItem('kpiwb_ts',ts);localStorage.setItem('kpiwb_nm',f.name);}catch(_){}
    document.getElementById('ustat').textContent='✓ usando a sua planilha · atualizada '+ts;
  }catch(err){document.getElementById('ustat').textContent='Erro ao ler o arquivo.';}};rd.readAsArrayBuffer(f);e.target.value='';};
(function(){let buf=null,from='base';try{const s=localStorage.getItem('kpiwb');if(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);buf=u.buffer;from='up';}}catch(_){}
  if(!buf)buf=ab();boot(XLSX.read(buf,{type:'array'}));
  const us=document.getElementById('ustat');
  if(from==='up'){const ts=localStorage.getItem('kpiwb_ts')||'';us.textContent='✓ usando a sua planilha'+(ts?' · atualizada '+ts:'');}
  else us.textContent='usando a planilha base — suba a sua para atualizar';})();
